<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>무드 플레이리스트</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="/css/fonts.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>무드 플레이리스트</h1>
      <p>지금 마음을 적어 보세요. 어울리는 플레이리스트를 찾아 드려요.</p>
    </header>

    <main>
      <form id="input-form">
        <label for="user-text">지금 어떤 기분인가요?</label>
        <textarea id="user-text" rows="5" maxlength="500" placeholder="예) 오늘 발표를 망친 것 같아서 계속 마음이 무거워요."></textarea>
        <div class="form-bottom">
          <p id="char-count">0 / 500</p>
          <button id="submit-btn" type="submit">분석하고 추천받기</button>
        </div>
      </form>

      <div id="loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>마음을 읽고 있어요…</p>
      </div>

      <div id="error-box" role="alert" hidden>
        <p id="error-message"></p>
      </div>

      <div id="support-notice" hidden>
        <p>지금 마음이 많이 힘드시다면 혼자 견디지 않으셔도 괜찮아요. 가까운 사람이나 전문 상담 기관에 이야기해 보세요. 자살예방 상담전화 <strong>109</strong>는 24시간 이용할 수 있어요.</p>
      </div>

      <section id="result" aria-live="polite" hidden>
        <h2>분석 결과</h2>
        <div class="result-card">
          <div class="emotion-header">
            <p id="result-emotion"></p>
            <p id="result-intensity"></p>
          </div>
          <p id="result-summary"></p>
        </div>

        <h2>분석 이유</h2>
        <div class="reason-card">
          <p id="result-reason"></p>
        </div>

        <h2>이런 플레이리스트는 어때요?</h2>
        <ul id="playlist-list"></ul>
      </section>
    </main>

    <footer>
      <p>이 분석은 의료적 진단이 아니며, 재미와 참고용으로 제공됩니다.</p>
    </footer>
  </div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
